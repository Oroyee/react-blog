[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# QA Ecosystem page (public/qa-ecosystem/): reachable by URL only, kept out of search results.
[[headers]]
  for = "/qa-ecosystem/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200